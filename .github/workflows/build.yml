name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-i386:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build linux-i386
      run: |
        scripts/build-ubuntu-i386.sh

  build-linux-amd64:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Build linux-amd64
      run: |
        scripts/build-ubuntu-amd64.sh

  build-android-armv7a:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Build android-armv7a
      run: |
        scripts/build-android-armv7a.sh

  build-windows-i386:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
    - name: Build windows-i386
      shell: cmd
      run: |
        call waf.bat configure -T debug --32bits
        call waf.bat build

  build-windows-amd64:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Show toolchain
      shell: cmd
      run: |
        where cl
        python --version
    - name: Build windows-amd64
      shell: cmd
      run: |
        call waf.bat configure -T debug --prefix=game
        call waf.bat build
        call waf.bat install
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: source-engine-windows-x64
        path: |
          game/bin/*.dll
          game/bin/*.exe
          game/bin/*.pdb
        if-no-files-found: warn
        retention-days: 14

  build-dedicated-windows-i386:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
    - name: Build dedicated windows-i386
      shell: cmd
      run: |
        call waf.bat configure -T debug -d --32bits
        call waf.bat build

  build-dedicated-windows-amd64:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Build dedicated windows-amd64
      shell: cmd
      run: |
        call waf.bat configure -T debug -d
        call waf.bat build

  build-dedicated-linux-i386:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Build dedicated linux-i386
      run: |
        scripts/build-ubuntu-i386.sh -d

  build-dedicated-linux-amd64:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Build dedicated linux-amd64
      run: |
        scripts/build-ubuntu-amd64.sh -d

  build-macos-amd64:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build macos-amd64
      run: |
        scripts/build-macos-amd64.sh

  build-dedicated-macos-amd64:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build dedicated macos-amd64
      run: |
        scripts/build-macos-amd64.sh -d
